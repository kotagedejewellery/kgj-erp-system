name: Deploy ERP Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: erp-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 \
            "${VPS_USER}@${VPS_HOST}" "bash -s -- '${DEPLOY_SHA}'" <<'EOF'
          set -euo pipefail

          deploy_sha="$1"
          cd /opt/apps/sistem-erp-kgj

          echo "[deploy] Verifying working tree"
          if [ -n "$(git status --porcelain)" ]; then
            echo "[deploy] Deployment stopped: working tree is not clean"
            git status --short
            exit 1
          fi

          echo "[deploy] Fetching tested commit ${deploy_sha}"
          git fetch --prune origin main
          if ! git cat-file -e "${deploy_sha}^{commit}"; then
            echo "[deploy] Deployment stopped: tested commit is unavailable on the VPS"
            exit 1
          fi

          echo "[deploy] Checking out tested commit"
          git checkout --detach "${deploy_sha}"

          echo "[deploy] Validating deployment configuration"
          docker compose --env-file .env.production -f compose.production.yml config
          echo "[deploy] Building and starting application"
          docker compose --env-file .env.production -f compose.production.yml \
            up -d --build --force-recreate
          docker compose --env-file .env.production -f compose.production.yml ps

          echo "[deploy] Waiting for application health check"
          ready=false
          for _ in $(seq 1 15); do
            if docker compose --env-file .env.production -f compose.production.yml \
              exec -T app node -e "fetch('http://127.0.0.1:3000/login').then((response) => process.exit(response.ok ? 0 : 1))"; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "${ready}" != true ]; then
            echo "[deploy] Application did not become ready; recent container logs follow"
            docker compose --env-file .env.production -f compose.production.yml logs --tail=100 app || true
            exit 1
          fi

          echo "[deploy] Verifying public login endpoint"
          if ! curl --fail --silent --show-error --head --retry 6 --retry-delay 5 \
            --max-time 15 https://erp.kotagedejewellery.tech/login; then
            echo "[deploy] Public health check failed; recent container logs follow"
            docker compose --env-file .env.production -f compose.production.yml logs --tail=100 app || true
            exit 1
          fi
          EOF
